<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; }
  #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 6px; justify-content: center; margin: 20px auto; }
  .cell { width: 100px; height: 100px; background: #222; border-radius: 8px; font-size: 48px;
          line-height: 100px; cursor: pointer; user-select: none; }
  .cell:hover { background: #333; }
  button { padding: 10px 24px; font-size: 16px; border: 0; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <h2 id="status">X's turn</h2>
  <div id="board"></div>
  <button onclick="reset()">Restart</button>
<script>
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, player, over;

  function winner() {
    for (const [a, b, c] of wins)
      if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
    return board.every(x => x) ? "draw" : null;
  }

  function draw() {
    const el = document.getElementById("board");
    el.innerHTML = "";
    board.forEach((v, i) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = v;
      cell.onclick = () => play(i);
      el.appendChild(cell);
    });
    const w = winner();
    document.getElementById("status").textContent =
      w === "draw" ? "Draw!" : w ? w + " wins! 🎉" : player + "'s turn";
  }

  function play(i) {
    if (over || board[i]) return;
    board[i] = player;
    if (winner()) over = true; else player = player === "X" ? "O" : "X";
    draw();
  }

  function reset() { board = Array(9).fill(""); player = "X"; over = false; draw(); }
  reset();
</script>
</body>
</html>
